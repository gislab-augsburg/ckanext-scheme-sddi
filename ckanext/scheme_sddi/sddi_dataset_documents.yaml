scheming_version: 2
dataset_type: dataset_documents
about: "SDDI Dataset and Documents metadata schema"
about_url: https://github.com/MarijaKnezevic/ckanext-scheme-sddi

dataset_fields:
# ============================================================
# BASE FIELDS — InformationResource (adapted from sddi_dataset.yaml style)
# ============================================================

  - field_name: title
    label: Title
    preset: title
    form_placeholder: eg. A descriptive title

  - field_name: name
    label: URL
    preset: dataset_slug
    form_placeholder: eg. my-dataset

  - field_name: notes
    label: Description
    required: True
    validators: scheming_required
    form_snippet: markdown.html
    form_placeholder: eg. Some useful notes about the data

  - field_name: tag_string
    label: Tags
    required: True
    preset: tag_string_autocomplete
    validators: required_tags tag_string_convert
    form_placeholder: eg. economy, mental health, government
    help_text:
      Über Tags können Katalogeinträge besser gefunden werden. Ein Tag ist
      ein Wort, welches im Zusammenhang mit dem Eintrag steht.

  - field_name: license_id
    label: License
    required: True
    validators: scheming_required
    form_snippet: license.html
    help_text: License definitions and additional information can be found at http://opendefinition.org/ Es wird empfohlen Creative Commons Zero oder Creative Commons Namensnennung für die offene Daten zu nutzen.

  - field_name: language
    label: Language
    validators: ignore_missing
    preset: select
    choices:
      - value: de
        label: Deutsch
      - value: en
        label: English
    help_text: Legt fest in welcher Sprache der Katalogeintrag verfasst ist.

  - field_name: author
    label: Author
    form_blanks: 1
    preset: composite_repeating
    subfields:
      - field_name: author_name
        label: Author
        required: True
        validators: scheming_required
        form_placeholder: Joe Bloggs

      - field_name: author_email
        form_placeholder: joe@example.com
        label: Author Email

  - field_name: maintainer
    label: Maintainer
    form_blanks: 1
    preset: composite_repeating
    subfields:
      - field_name: maintainer_name
        label: Maintainer
        form_placeholder: Joe Bloggs

      - field_name: maintainer_email
        form_placeholder: joe@example.com
        label: Maintainer Email

      - field_name: phone
        label: Phone number
        display_snippet: text.html
        form_placeholder: "+49 8161 71 0000"

      - field_name: role
        label: Role
        preset: select
        display_snippet: multiple_select.html
        choices:
          - value: data_collector
            label: Data Collector
          - value: expert
            label: Expert
          - value: resourceProvider
            label: Resource Provider
          - value: custodian
            label: Custodian
          - value: owner
            label: Owner
          - value: distributor
            label: Distributor
          - value: originator
            label: Originator
          - value: pointOfContact
            label: Point of Contact
          - value: principalInvestigator
            label: Principal Investigator
          - value: processor
            label: Processor
          - value: publisher
            label: Publisher
          - value: author
            label: Author
          - value: sponsor
            label: Sponsor
          - value: coAuthor
            label: Co-Author
          - value: collaborator
            label: Collaborator
          - value: editor
            label: Editor
          - value: mediator
            label: Mediator
          - value: rightsHolder
            label: Rights Holder
          - value: contributor
            label: Contributor
          - value: funder
            label: Funder
          - value: stakeholder
            label: Stakeholder

  - field_name: owner_org
    label: Organization
    form_snippet: organization_alone.html
    help_text: Legt fest welcher Organisation der Katalogeintrag zugeordnet ist.

  - field_name: owner_org
    label: Organization
    form_snippet: visibility.html
    help_text: Legt fest wer den Katalogeintrag sehen kann.

  - field_name: group
    label: Group
    form_snippet: group.html
    display_snippet: null

  - field_name: custom-fields
    label: Benutzerdefiniertes Feld
    form_snippet: custom_form_fields.html

  - field_name: update_period
    label: Update Period
    validators: ignore_missing
    preset: select
    choices:
      - value: continual
        label: Continual
      - value: daily
        label: Daily
      - value: weekly
        label: Weekly
      - value: fortnightly
        label: Fortnightly
      - value: monthly
        label: Monthly
      - value: quarterly
        label: Quarterly
      - value: biannually
        label: Biannually
      - value: annually
        label: Annually
      - value: asNeeded
        label: As Needed
      - value: irregular
        label: Irregular
      - value: notPlanned
        label: Not Planned
      - value: unknown
        label: Unknown
      - value: periodic
        label: Periodic
      - value: semimonthly
        label: Semimonthly
      - value: biennially
        label: Biennially

  - field_name: begin_collection_date
    label: Start des Gültigkeitszeitraumes
    preset: date

  - field_name: end_collection_date
    label: Ende des Gültigkeitszeitraumes
    preset: date
    help_text:
      Dies markiert den Gültigkeitszeitraum des Katalogeintrags.

  - field_name: spatial
    label:
      en: Spatial extent
      de: Räumliche Ausdehnung
    form_snippet: spatial.html
    display_snippet: spatial.html
    help_text: Über eine räumliche Ausdehnung (Punkt oder Polygon) kann später nach Katalogeinträgen gesucht werden.

  - field_name: licence_agreement
    label: Datenschutzerklärung
    required: True
    preset: multiple_checkbox
    choices:
      - value: licence_agreement_check
        label: Hiermit bestätige ich, dass sämtliche von mir eingetragenen Daten unter die oben ausgewählte Lizenz fallen.

 # ---- Dataset and Documents specific fields ----
 
  - field_name: format
    label: Format
    help_text: General format or representation of the content.
 
  - field_name: data_type
    label: Data Type
    form_snippet: select.html
    help_text: >
      OCL constraint: spatial data types (vector, raster, point_cloud, etc.)
      require referenceSystemType, defaultHorizontalCRS, defaultVerticalCRS,
      horizontalResolution, and verticalResolution to be filled in.
    choices:
      - value: vector
        label: Vector
      - value: vector_point
        label: Vector – Point
      - value: vector_polygon
        label: Vector – Polygon
      - value: vector_polyline
        label: Vector – Polyline
      - value: vector_line
        label: Vector – Line
      - value: vector_3d
        label: Vector – 3D
      - value: point_cloud
        label: Point Cloud
      - value: voxel_grid
        label: Voxel Grid
      - value: mesh_3d
        label: Mesh 3D
      - value: raster
        label: Raster
      - value: text
        label: Text
      - value: image
        label: Image
      - value: video
        label: Video
      - value: multimodal
        label: Multimodal
      - value: tabular
        label: Tabular
      - value: audio
        label: Audio
      - value: other
        label: Other

  - field_name: usage_info
    label:  Usage Info
    help_text: Information describing intended usage, limitations, or usage recommendations for the content.
 
  - field_name: reference_system_type
    label: Reference System Type
    form_snippet: select.html
    help_text: Required when dataType is a spatial type.
    choices:
      - value: compoundEngineeringParametric
        label: Compound Engineering – Parametric
      - value: compoundEngineeringParametricTemporal
        label: Compound Engineering – Parametric Temporal
      - value: compoundEngineeringTemporal
        label: Compound Engineering – Temporal
      - value: compoundEngineeringVertical
        label: Compound Engineering – Vertical
      - value: compoundEngineeringVerticalTemporal
        label: Compound Engineering – Vertical – Temporal
      - value: compoundGeographic2DParametric
        label: Compound Geographic 2D – Parametric
      - value: compoundGeographic2DParametricTemporal
        label: Compound Geographic 2D – Parametric Temporal
      - value: compoundGeographic2DTemporal
        label: Compound Geographic 2D – Temporal
      - value: compoundGeographic2DVertical
        label: Compound Geographic 2D – Vertical
      - value: compoundGeographic2DVerticalTemporal
        label: Compound Geographic 2D – Vertical – Temporal
      - value: compoundGeographic3DTemporal
        label: Compound Geographic 3D – Temporal
      - value: compoundProjected2DParametric
        label: Compound Projected 2D – Parametric
      - value: compoundProjected2DParametricTemporal
        label: Compound Projected 2D – Parametric – Temporal
      - value: compoundProjectedTemporal
        label: Compound Projected – Temporal
      - value: compoundProjectedVertical
        label: Compound Projected – Vertical
      - value: compoundProjectedVerticalTemporal
        label: Compound Projected – Vertical – Temporal
      - value: engineering
        label: Engineering
      - value: engineeringDesign
        label: Engineering Design
      - value: engineeringImage
        label: Engineering Image
      - value: geodeticGeocentric
        label: Geodetic Geocentric
      - value: geodeticGeographic2D
        label: Geodetic Geographic 2D
      - value: geodeticGeographic3D
        label: Geodetic Geographic 3D
      - value: geographicIdentifier
        label: Geographic Identifier
      - value: linear
        label: Linear
      - value: parametric
        label: Parametric
      - value: projected
        label: Projected
      - value: temporal
        label: Temporal
      - value: vertical
        label: Vertical

  - field_name: default_horizontal_crs
    label: Default Horizontal CRS
    help_text: e.g. EPSG:4326, EPSG:25832. Required for spatial data types. More information can be found at  https://epsg.io/.
 
  - field_name: default_vertical_crs
    label: Default Vertical CRS
    help_text: e.g. EPSG:5783. Required for spatial data types. More information can be found at  https://epsg.io/.
 
  - field_name: horizontal_resolution
    label: Horizontal Resolution
    form_placeholder: "e.g. 1m, 10m, 1:1000, 1 pt/m²"
    help_text: Ground resolution of the dataset. Required when Data Type is a spatial type.
 
  - field_name: vertical_resolution
    label: Vertical Resolution
    form_placeholder: "e.g. 0.1m, 0.5m, 1m"
    help_text: Vertical accuracy or height resolution of the dataset. Required for spatial data types.
 
  - field_name: content_url
    label: Content URL (Distribution)
    help_text: URL to the primary distribution of this dataset.
 
resource_fields:
 
  - field_name: url
    label: URL
    preset: resource_url_upload
 
  - field_name: name
    label: Name
 
  - field_name: description
    label: Description
    form_snippet: textarea.html
 
  - field_name: format
    label: Format
    preset: resource_format_autocomplete
 
  - field_name: access_url
    label: Access URL
 
  - field_name: download_url
    label: Download URL
 
  - field_name: byte_size
    label: Byte Size
    validators: ignore_missing int_validator
 
  - field_name: mime_type
    label: MIME Type
 
  - field_name: character_set
    label: Character Set
 
  - field_name: distribution_access_rights
    label: Distribution Access Rights
    form_snippet: select.html
    choices:
      - value: public
        label: Public
      - value: registered_user
        label: Registered user
      - value: organization_member
        label: Organization member
      - value: allowed_user_only
        label: Allowed user only
 
  - field_name: allowed_users
    label: Allowed Users
    preset: tag_string_autocomplete
    data-module-source: "/api/2/util/user/autocomplete?q=?"
    
  - field_name: issued
    label: Issued
    preset: date
 
  - field_name: modified
    label: Modified
    preset: date
 
  - field_name: license
    label: Licence