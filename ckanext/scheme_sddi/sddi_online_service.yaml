scheming_version: 2
dataset_type: online-service
about: "SDDI Online Service metadata schema"
about_url: https://github.com/MarijaKnezevic/ckanext-scheme-sddi

dataset_fields:
# ============================================================
# BASE FIELDS — InformationResource (adapted from sddi_dataset.yaml style)
# ============================================================

  - field_name: title
    label: Title
    preset: title
    form_placeholder: eg. A descriptive title

  - field_name: name
    label: URL
    preset: dataset_slug
    form_placeholder: eg. my-dataset

  - field_name: notes
    label: Description
    required: True
    validators: scheming_required
    form_snippet: markdown.html
    form_placeholder: eg. Some useful notes about the data

  - field_name: tag_string
    label: Tags
    required: True
    preset: tag_string_autocomplete
    validators: required_tags tag_string_convert
    form_placeholder: eg. economy, mental health, government
    help_text:
      Über Tags können Katalogeinträge besser gefunden werden. Ein Tag ist
      ein Wort, welches im Zusammenhang mit dem Eintrag steht.

  - field_name: license_id
    label: License
    required: True
    validators: scheming_required
    form_snippet: license.html
    help_text: License definitions and additional information can be found at http://opendefinition.org/ Es wird empfohlen Creative Commons Zero oder Creative Commons Namensnennung für die offene Daten zu nutzen.

  - field_name: language
    label: Language
    validators: ignore_missing
    preset: select
    choices:
      - value: de
        label: Deutsch
      - value: en
        label: English
    help_text: Legt fest in welcher Sprache der Katalogeintrag verfasst ist.

  - field_name: author
    label: Author
    form_blanks: 1
    preset: composite_repeating
    subfields:
      - field_name: author_name
        label: Author
        required: True
        validators: scheming_required
        form_placeholder: Joe Bloggs

      - field_name: author_email
        form_placeholder: joe@example.com
        label: Author Email

  - field_name: maintainer
    label: Maintainer
    form_blanks: 1
    preset: composite_repeating
    subfields:
      - field_name: maintainer_name
        label: Maintainer
        form_placeholder: Joe Bloggs

      - field_name: maintainer_email
        form_placeholder: joe@example.com
        label: Maintainer Email

      - field_name: phone
        label: Phone number
        display_snippet: text.html
        form_placeholder: "+49 8161 71 0000"

      - field_name: role
        label: Role
        preset: select
        display_snippet: multiple_select.html
        choices:
          - value: data_collector
            label: Data Collector
          - value: expert
            label: Expert
          - value: resourceProvider
            label: Resource Provider
          - value: custodian
            label: Custodian
          - value: owner
            label: Owner
          - value: distributor
            label: Distributor
          - value: originator
            label: Originator
          - value: pointOfContact
            label: Point of Contact
          - value: principalInvestigator
            label: Principal Investigator
          - value: processor
            label: Processor
          - value: publisher
            label: Publisher
          - value: author
            label: Author
          - value: sponsor
            label: Sponsor
          - value: coAuthor
            label: Co-Author
          - value: collaborator
            label: Collaborator
          - value: editor
            label: Editor
          - value: mediator
            label: Mediator
          - value: rightsHolder
            label: Rights Holder
          - value: contributor
            label: Contributor
          - value: funder
            label: Funder
          - value: stakeholder
            label: Stakeholder

  - field_name: owner_org
    label: Organization
    form_snippet: organization_alone.html
    help_text: Legt fest welcher Organisation der Katalogeintrag zugeordnet ist.

  - field_name: owner_org
    label: Organization
    form_snippet: visibility.html
    help_text: Legt fest wer den Katalogeintrag sehen kann.

  - field_name: group
    label: Group
    form_snippet: group.html
    display_snippet: null

  - field_name: custom-fields
    label: Benutzerdefiniertes Feld
    form_snippet: custom_form_fields.html

  - field_name: update_period
    label: Update Period
    validators: ignore_missing
    preset: select
    choices:
      - value: continual
        label: Continual
      - value: daily
        label: Daily
      - value: weekly
        label: Weekly
      - value: fortnightly
        label: Fortnightly
      - value: monthly
        label: Monthly
      - value: quarterly
        label: Quarterly
      - value: biannually
        label: Biannually
      - value: annually
        label: Annually
      - value: asNeeded
        label: As Needed
      - value: irregular
        label: Irregular
      - value: notPlanned
        label: Not Planned
      - value: unknown
        label: Unknown
      - value: periodic
        label: Periodic
      - value: semimonthly
        label: Semimonthly
      - value: biennially
        label: Biennially

  - field_name: begin_collection_date
    label: Start des Gültigkeitszeitraumes
    preset: date

  - field_name: end_collection_date
    label: Ende des Gültigkeitszeitraumes
    preset: date
    help_text:
      Dies markiert den Gültigkeitszeitraum des Katalogeintrags.

  - field_name: spatial
    label:
      en: Spatial extent
      de: Räumliche Ausdehnung
    form_snippet: spatial.html
    display_snippet: spatial.html
    help_text: Über eine räumliche Ausdehnung (Punkt oder Polygon) kann später nach Katalogeinträgen gesucht werden.

  - field_name: licence_agreement
    label: Datenschutzerklärung
    required: True
    preset: multiple_checkbox
    choices:
      - value: licence_agreement_check
        label: Hiermit bestätige ich, dass sämtliche von mir eingetragenen Daten unter die oben ausgewählte Lizenz fallen.

  # ── Online Service specific fields ───────────────────────────────────────

  - field_name: service_type
    label: Service Type
    validators: ignore_missing
    preset: select
    choices:
      - value: WMS
        label: Web Map Service (WMS)
      - value: WMTS
        label: Web Map Tile Service (WMTS)
      - value: WFS
        label: Web Feature Service (WFS)
      - value: WCS
        label: Web Coverage Service (WCS)
      - value: CSW
        label: Catalogue Service for the Web (CSW)
      - value: OGC_API_Features
        label: OGC API – Features
      - value: OGC_API_Tiles
        label: OGC API – Tiles
      - value: OGC_API_Coverages
        label: OGC API – Coverages
      - value: OGC_API_Processes
        label: OGC API – Processes
      - value: API
        label: API
      - value: RESTful
        label: RESTful API
      - value: SOAP
        label: SOAP-based service
      - value: GraphQL
        label: GraphQL endpoint
      - value: RPC
        label: RPC – Remote Procedure Call
      - value: SPARQL
        label: SPARQL endpoint
      - value: SQL
        label: SQL query service
      - value: other_open
        label: Other (Open)
      - value: other_not_open
        label: Other (Not Open)
      - value: other_nc
        label: Other (Non-Commercial)

  - field_name: service_type_version
    label: Service Type Version
    validators: ignore_missing
    form_placeholder: e.g. WMS 1.3.0

  - field_name: service_standard
    label: Service Standard
    validators: ignore_missing
    preset: select
    choices:
      - value: OGC_WMS
        label: OGC Web Map Service
      - value: OGC_WFS
        label: OGC Web Feature Service
      - value: OGC_WCS
        label: OGC Web Coverage Service
      - value: OGC_WMTS
        label: OGC Web Map Tile Service
      - value: OGC_CSW
        label: OGC Catalogue Service
      - value: OGC_API_Features
        label: OGC API – Features
      - value: OGC_API_Tiles
        label: OGC API – Tiles
      - value: OGC_API_Coverages
        label: OGC API – Coverages
      - value: OGC_API_Processes
        label: OGC API – Processes
      - value: SLD
        label: Styled Layer Descriptor
      - value: OpenAPI
        label: OpenAPI Specification
      - value: REST
        label: REST architectural style
      - value: SOAP
        label: SOAP
      - value: GraphQL
        label: GraphQL specification
      - value: other_open
        label: Other (Open)
      - value: other_not_open
        label: Other (Not Open)
      - value: other_non_commercial
        label: Other (Non-Commercial)

  - field_name: protocol
    label: Protocol
    validators: ignore_missing
    preset: select
    choices:
      - value: HTTP
        label: HTTP
      - value: HTTPS
        label: HTTPS
      - value: WebSocket
        label: WebSocket
      - value: SOAP
        label: SOAP
      - value: RPC
        label: RPC
      - value: GraphQL
        label: GraphQL
      - value: MQTT
        label: MQTT
      - value: AMQP
        label: AMQP
      - value: STOMP
        label: STOMP
      - value: Other
        label: Other

  - field_name: protocol_request
    label: Protocol Request
    validators: ignore_missing
    form_placeholder: e.g. GetMap, GetFeature
    help_text: Template or description of the request pattern used for the protocol (e.g., query parameters, headers).

  - field_name: operations_metadata
    label: Operations Metadata
    validators: ignore_missing
    form_snippet: markdown.html
    help_text: Reference to operations metadata (e.g., capabilities document, OpenAPI spec location) or textual description of supported operations.

  - field_name: service_provider
    label: Service Provider
    validators: ignore_missing
    form_placeholder: e.g. Landesamt für Digitalisierung Bayern
    help_text: Name of the organization or entity providing the service.

  - field_name: fees
    label: Fees
    validators: ignore_missing
    form_placeholder: "e.g. 0.00"

  - field_name: security
    label: Security
    validators: ignore_missing
    form_placeholder: e.g. OAuth2, API Key
    help_text: Security requirements and mechanisms (e.g., TLS, OAuth2, API key, certificates).

  - field_name: external_docs
    label: External Documentation URL
    validators: ignore_missing
    form_placeholder: https://example.com/docs

  - field_name: data_type
    label: Data Type
    validators: ignore_missing
    preset: select
    choices:
      - value: vector
        label: Vector
      - value: vector_point
        label: Vector – Point
      - value: vector_polygon
        label: Vector – Polygon
      - value: vector_polyline
        label: Vector – Polyline
      - value: vector_line
        label: Vector – Line
      - value: vector_3d
        label: Vector – 3D
      - value: point_cloud
        label: Point Cloud
      - value: voxel_grid
        label: Voxel Grid
      - value: mesh_3d
        label: Mesh 3D
      - value: raster
        label: Raster
      - value: text
        label: Text
      - value: image
        label: Image
      - value: video
        label: Video
      - value: multimodal
        label: Multimodal
      - value: tabular
        label: Tabular
      - value: audio
        label: Audio
      - value: Other
        label: other

  - field_name: http_method
    label: HTTP Method
    validators: ignore_missing
    preset: select
    choices:
      - value: GET
        label: GET
      - value: POST
        label: POST
      - value: PUT
        label: PUT
      - value: PATCH
        label: PATCH
      - value: DELETE
        label: DELETE
      - value: HEAD
        label: HEAD
      - value: OPTIONS
        label: OPTIONS
      - value: TRACE
        label: TRACE

  - field_name: endpoint_path
    label: Endpoint Path
    validators: ignore_missing
    form_placeholder: e.g. /collections/buildings

resource_fields:
 
  - field_name: url
    label: URL
    preset: resource_url_upload
 
  - field_name: name
    label: Name
 
  - field_name: description
    label: Description
    form_snippet: textarea.html
 
  - field_name: linkage
    label: Service Endpoint URL
    validators: ignore_missing
    form_placeholder: https://example.com/wms

  - field_name: open_api_document
    label: OpenAPI Document URL
    validators: ignore_missing
    form_placeholder: https://example.com/openapi.json

  - field_name: format
    label: Format
    preset: resource_format_autocomplete
 
  - field_name: access_url
    label: Access URL
 
  - field_name: download_url
    label: Download URL
 
  - field_name: byte_size
    label: Byte Size
    validators: ignore_missing int_validator
 
  - field_name: mime_type
    label: MIME Type
 
  - field_name: character_set
    label: Character Set
 
  - field_name: distribution_access_rights
    label: Distribution Access Rights
    form_snippet: select.html
    choices:
      - value: public
        label: Public
      - value: registered_user
        label: Registered user
      - value: organization_member
        label: Organization member
      - value: allowed_user_only
        label: Allowed user only

  - field_name: allowed_users
    label: Allowed Users
    preset: tag_string_autocomplete
    data-module-source: "/api/2/util/user/autocomplete?q=?"
    
  - field_name: issued
    label: Issued
    preset: date
 
  - field_name: modified
    label: Modified
    preset: date
 
  - field_name: license
    label: Licence