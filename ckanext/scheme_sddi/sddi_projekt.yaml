scheming_version: 2
dataset_type: project
about: "SDDI Project metadata schema — extends InformationResource with project-specific fields."
about_url: https://github.com/MarijaKnezevic/ckanext-scheme-sddi

dataset_fields:

  # ---- InformationResource base fields (shared across all types) ----
  - field_name: title
    label: Title
    preset: title
    form_placeholder: eg. A descriptive title

  - field_name: name
    label: URL
    preset: dataset_slug
    form_placeholder: eg. my-dataset

  - field_name: notes
    label: Description
    required: True
    validators: scheming_required
    form_snippet: markdown.html
    form_placeholder: eg. Some useful notes about the data

  - field_name: tag_string
    label: Tags
    required: True
    preset: tag_string_autocomplete
    validators: required_tags tag_string_convert
    form_placeholder: eg. economy, mental health, government
    help_text:
      Über Tags können Katalogeinträge besser gefunden werden. Ein Tag ist
      ein Wort, welches im Zusammenhang mit dem Eintrag steht.

  - field_name: license_id
    label: License
    required: True
    validators: scheming_required
    form_snippet: license.html
    help_text: License definitions and additional information can be found at http://opendefinition.org/ Es wird empfohlen Creative Commons Zero oder Creative Commons Namensnennung für die offene Daten zu nutzen.

  - field_name: language
    label: Language
    validators: ignore_missing
    preset: select
    choices:
      - value: de
        label: Deutsch
      - value: en
        label: English
    help_text: Legt fest in welcher Sprache der Katalogeintrag verfasst ist.

  - field_name: author
    label: Author
    form_blanks: 1
    preset: composite_repeating
    subfields:
      - field_name: author_name
        label: Author
        required: True
        validators: scheming_required
        form_placeholder: Joe Bloggs

      - field_name: author_email
        form_placeholder: joe@example.com
        label: Author Email

  - field_name: maintainer
    label: Maintainer
    form_blanks: 1
    preset: composite_repeating
    subfields:
      - field_name: maintainer_name
        label: Maintainer
        form_placeholder: Joe Bloggs

      - field_name: maintainer_email
        form_placeholder: joe@example.com
        label: Maintainer Email

      - field_name: phone
        label: Phone number
        display_snippet: text.html
        form_placeholder: "+49 8161 71 0000"

      - field_name: role
        label: Role
        preset: select
        display_snippet: multiple_select.html
        choices:
          - value: data_collector
            label: Data Collector
          - value: expert
            label: Expert
          - value: resourceProvider
            label: Resource Provider
          - value: custodian
            label: Custodian
          - value: owner
            label: Owner
          - value: distributor
            label: Distributor
          - value: originator
            label: Originator
          - value: pointOfContact
            label: Point of Contact
          - value: principalInvestigator
            label: Principal Investigator
          - value: processor
            label: Processor
          - value: publisher
            label: Publisher
          - value: author
            label: Author
          - value: sponsor
            label: Sponsor
          - value: coAuthor
            label: Co-Author
          - value: collaborator
            label: Collaborator
          - value: editor
            label: Editor
          - value: mediator
            label: Mediator
          - value: rightsHolder
            label: Rights Holder
          - value: contributor
            label: Contributor
          - value: funder
            label: Funder
          - value: stakeholder
            label: Stakeholder

  - field_name: owner_org
    label: Organization
    form_snippet: organization_alone.html
    help_text: Legt fest welcher Organisation der Katalogeintrag zugeordnet ist.

  - field_name: owner_org
    label: Organization
    form_snippet: visibility.html
    help_text: Legt fest wer den Katalogeintrag sehen kann.

  - field_name: group
    label: Group
    form_snippet: group.html
    display_snippet: null

  - field_name: custom-fields
    label: Benutzerdefiniertes Feld
    form_snippet: custom_form_fields.html

  - field_name: update_period
    label: Update Period
    validators: ignore_missing
    preset: select
    choices:
      - value: continual
        label: Continual
      - value: daily
        label: Daily
      - value: weekly
        label: Weekly
      - value: fortnightly
        label: Fortnightly
      - value: monthly
        label: Monthly
      - value: quarterly
        label: Quarterly
      - value: biannually
        label: Biannually
      - value: annually
        label: Annually
      - value: asNeeded
        label: As Needed
      - value: irregular
        label: Irregular
      - value: notPlanned
        label: Not Planned
      - value: unknown
        label: Unknown
      - value: periodic
        label: Periodic
      - value: semimonthly
        label: Semimonthly
      - value: biennially
        label: Biennially

  - field_name: begin_collection_date
    label: Start des Gültigkeitszeitraumes
    preset: date

  - field_name: end_collection_date
    label: Ende des Gültigkeitszeitraumes
    preset: date
    help_text:
      Dies markiert den Gültigkeitszeitraum des Katalogeintrags.

  - field_name: spatial
    label:
      en: Spatial extent
      de: Räumliche Ausdehnung
    form_snippet: spatial.html
    display_snippet: spatial.html
    help_text: Über eine räumliche Ausdehnung (Punkt oder Polygon) kann später nach Katalogeinträgen gesucht werden.

  - field_name: licence_agreement
    label: Datenschutzerklärung
    required: True
    preset: multiple_checkbox
    choices:
      - value: licence_agreement_check
        label: Hiermit bestätige ich, dass sämtliche von mir eingetragenen Daten unter die oben ausgewählte Lizenz fallen.

  # ---- Project-specific fields ----

  - field_name: project_manager
    label: Project Manager
    help_text: Name of the project manager.

  - field_name: project_manager_mail
    label: Project Manager Email

  - field_name: involved_organizations
    label: Involved Organizations
    help_text: Names of organizations involved in the project. Separate with semicolons.

  - field_name: project_team
    label: Project Team
    help_text: Names of team members. Separate with semicolons.

  - field_name: costs
    label: Costs (Decimal)
    help_text: Total project costs as a decimal number.
    validators: ignore_missing float_validator

  - field_name: project_status
    label: Project Status
    form_snippet: select.html
    choices:
      - value: concept
        label: Concept
      - value: design
        label: Design
      - value: development
        label: Development
      - value: testing
        label: Testing
      - value: operational
        label: Operational
      - value: maintenance
        label: Maintenance
      - value: deprecated
        label: Deprecated
      - value: suspended
        label: Suspended
      - value: pilot
        label: Pilot
      - value: archived
        label: Archived
      - value: prototype
        label: Prototype
      - value: planned
        label: Planned
      - value: approved
        label: Approved
      - value: released
        label: Released
      - value: experimental
        label: Experimental

resource_fields:

  - field_name: url
    label: URL
    preset: resource_url_upload

  - field_name: name
    label: Name
    form_placeholder: "e.g. Project report PDF"

  - field_name: description
    label: Description
    form_snippet: textarea.html

  - field_name: project_uri
    label: Project URI / Distribution
    help_text: URL to an associated distribution or project page.

  - field_name: format
    label: Format
    preset: resource_format_autocomplete

  - field_name: access_url
    label: Access URL

  - field_name: download_url
    label: Download URL

  - field_name: byte_size
    label: Byte Size
    validators: ignore_missing int_validator

  - field_name: mime_type
    label: MIME Type

  - field_name: character_set
    label: Character Set

  - field_name: distribution_access_rights
    label: Distribution Access Rights
    form_snippet: select.html
    choices:
      - value: public
        label: Public
      - value: registered_user
        label: Registered user
      - value: organization_member
        label: Organization member
      - value: allowed_user_only
        label: Allowed user only

  - field_name: issued
    label: Issued
    preset: date

  - field_name: modified
    label: Modified
    preset: date

  - field_name: license
    label: Licence